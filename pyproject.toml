[project]
name = "gocai_py"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "pydantic", "matplotlib", "Pillow"]

[project.scripts]
gw-legacy = "gocai.gw:main"
mdpi = "mdp_inference.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
